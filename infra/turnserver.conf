# Coturn TURN/STUN Server Configuration
listening-port=3478
tls-listening-port=5349

# Realm for TURN credentials
realm=chatapp.local

# Ephemeral Time-Windowed HMAC-SHA1 TURN Credentials
use-auth-secret
static-auth-secret=coturn_shared_secret_secure_key_2026

# UDP relay port range
min-port=49152
max-port=49200

# Logging
verbose
fingerprint
lt-cred-mech

# Security hardening
no-multicast-peers
no-cli
no-tls-tickets
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
