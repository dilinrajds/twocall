server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: chatapp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Custom Security, Pairing, Media & WebRTC Settings
app:
  jwt:
    secret: ${JWT_SECRET:4Z03kI3/YpA2W5Q6kFv7eJ8lM9nO0pQ1rS2tU3vW4xY5zA6bC7dE8fG9hI0jK1lM2nO3pQ4rS5tU6vW7xY8z9A==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000} # 30 days
  pairing:
    code-ttl-seconds: ${PAIRING_CODE_EXPIRATION_SECONDS:300} # 5 minutes
    max-attempts: ${PAIRING_CODE_MAX_ATTEMPTS:5}
    rate-limit-per-minute: ${PAIRING_RATE_LIMIT_PER_MINUTE:10}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./uploads/media}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:52428800} # 50 MB
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:./config/firebase-service-account.json}
  webrtc:
    stun-url: ${STUN_SERVER_URL:stun:stun.l.google.com:19302}
    turn-url: ${TURN_SERVER_URL:turn:localhost:3478}
    turn-realm: ${TURN_SERVER_REALM:chatapp.local}
    turn-shared-secret: ${TURN_SHARED_SECRET:coturn_shared_secret_secure_key_2026}
    turn-ttl-seconds: ${TURN_CREDENTIAL_TTL_SECONDS:86400}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatapp_db}?reWriteBatchedInserts=true
    username: ${DB_USER:chatapp_user}
    password: ${DB_PASSWORD:chatapp_secure_dev_pass_2026}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: h2test
  datasource:
    url: jdbc:h2:mem:chatapp_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatapp_db}?sslmode=require&reWriteBatchedInserts=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:chatapp_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

